<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Проверка мобильной вёрстки</title>
    <style>
      body {
        margin: 16px;
        font: 16px system-ui;
        background: #eee;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        margin-bottom: 12px;
      }
      iframe {
        display: block;
        width: 390px;
        height: 800px;
        border: 0;
        background: white;
      }
      pre {
        white-space: pre-wrap;
        max-width: 1100px;
      }
      button,
      select {
        font: inherit;
        padding: 8px;
      }
    </style>
  </head>
  <body>
    <header>
      <label
        >Ширина
        <select id="width">
          <option>320</option>
          <option>360</option>
          <option selected>390</option>
          <option>430</option>
          <option>768</option>
          <option>1280</option>
        </select></label
      >
      <label
        >Страница
        <select id="route">
          <option value="/catalog/all/">Каталог</option>
          <option value="/">Главная</option>
          <option value="/search/?q=платье">Поиск</option>
          <option value="/basket/">Корзина</option>
          <option value="/catalog/kostyumy/testovyy-tovar/">Карточка</option>
        </select></label
      >
      <button id="measure">Измерить ширину</button>
      <button id="filter">Фильтры</button>
      <button id="close">Закрыть фильтры</button>
      <button id="bottom">Пагинация</button>
      <button id="next">Следующая страница</button>
      <button id="top">Начало страницы</button>
    </header>
    <pre id="result">Ожидание загрузки</pre>
    <iframe id="preview" title="Мобильный сайт" src="/catalog/all/"></iframe>
    <script>
      const frame = document.querySelector('#preview');
      document.querySelector('#width').onchange = (event) => {
        frame.style.width = event.target.value + 'px';
      };
      document.querySelector('#route').onchange = (event) => {
        frame.src = event.target.value;
      };
      document.querySelector('#filter').onclick = () =>
        [...frame.contentDocument.querySelectorAll('button')]
          .find((button) => button.textContent.trim() === 'ФИЛЬТРЫ')
          ?.click();
      document.querySelector('#close').onclick = () =>
        frame.contentDocument.querySelector('[aria-label="Закрыть"]')?.click();
      document.querySelector('#bottom').onclick = () =>
        frame.contentDocument.querySelector('[aria-label="Страницы каталога"]')?.scrollIntoView({ block: 'center' });
      document.querySelector('#next').onclick = () =>
        frame.contentDocument.querySelector('[aria-label="Следующая страница"]')?.click();
      document.querySelector('#top').onclick = () => frame.contentWindow.scrollTo({ top: 0, behavior: 'instant' });
      document.querySelector('#measure').onclick = () => {
        const doc = frame.contentDocument;
        const root = doc.documentElement;
        const pagination = doc.querySelector('[aria-label="Страницы каталога"]');
        const overflow = [...doc.body.querySelectorAll('*')]
          .filter((el) => {
            const box = el.getBoundingClientRect();
            if (box.right <= root.clientWidth + 1 || box.width === 0) return false;
            for (let parent = el.parentElement; parent && parent !== doc.body; parent = parent.parentElement) {
              if (['hidden', 'clip', 'scroll', 'auto'].includes(frame.contentWindow.getComputedStyle(parent).overflowX))
                return false;
            }
            return true;
          })
          .map((el) => ({
            tag: el.tagName,
            cls: typeof el.className === 'string' ? el.className : '',
            right: Math.round(el.getBoundingClientRect().right),
            width: Math.round(el.getBoundingClientRect().width),
          }))
          .slice(0, 8);
        document.querySelector('#result').textContent = JSON.stringify(
          {
            viewport: frame.contentWindow.innerWidth,
            client: root.clientWidth,
            scroll: root.scrollWidth,
            body: doc.body.scrollWidth,
            pagination: pagination
              ? {
                  width: Math.round(pagination.getBoundingClientRect().width),
                  buttons: pagination.querySelectorAll('button').length,
                  current: pagination.querySelector('[aria-current="page"]')?.textContent,
                }
              : null,
            overflow,
          },
          null,
          2,
        );
      };
    </script>
  </body>
</html>
